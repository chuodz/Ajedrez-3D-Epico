<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Ajedrez 3D Épico - Edición Leyenda</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <style>
    :root {
      --gold-primary: #f39c12;
      --gold-light: #f1c40f;
      --gold-glow: rgba(243, 156, 18, 0.65);
      --dark-bg: #090b10;
      --deep-bg: #0d121b;
      --card-bg: rgba(17, 22, 31, 0.82);
      --card-border: rgba(255, 214, 113, 0.4);
      --white-piece: #f6f0e9;
      --black-piece: #111827;
      --green-valid: #24d17e;
      --red-warning: #ff5a5a;
      --shadow: rgba(0, 0, 0, 0.5);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-user-select: none;
      user-select: none;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--dark-bg);
      color: #fff;
    }

    body {
      position: relative;
      background:
        radial-gradient(circle at top, rgba(227, 170, 48, 0.18), transparent 18%),
        linear-gradient(180deg, #0a0d12 0%, #0c1018 100%);
    }

    #canvas-container {
      position: absolute;
      inset: 0;
      z-index: 1;
    }

    #start-menu {
      position: absolute;
      inset: 0;
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      background:
        radial-gradient(circle at center, rgba(42, 53, 78, 0.9) 0%, rgba(13, 17, 25, 0.96) 42%, rgba(7, 9, 15, 1) 100%);
      transition: opacity 0.5s ease;
      overflow: hidden;
    }

    #start-menu::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 20% 10%, rgba(255,255,255,0.12), transparent 16%),
        radial-gradient(circle at 78% 20%, rgba(255,255,255,0.08), transparent 18%),
        radial-gradient(circle at 60% 80%, rgba(255,255,255,0.08), transparent 22%);
      pointer-events: none;
    }

    .epic-title-box {
      text-align: center;
      position: relative;
      z-index: 2;
      margin-bottom: 8px;
    }

    .epic-title {
      font-size: clamp(2.2rem, 5vw, 4rem);
      font-weight: 900;
      letter-spacing: 4px;
      text-transform: uppercase;
      background: linear-gradient(135deg, #fff 0%, #f1c40f 25%, #f39c12 55%, #d35400 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 0 0 18px rgba(243, 156, 18, 0.5);
      margin-bottom: 8px;
    }

    .epic-subtitle {
      font-size: 0.82rem;
      letter-spacing: 5px;
      text-transform: uppercase;
      color: rgba(224, 229, 238, 0.8);
    }

    .menu-buttons {
      position: relative;
      z-index: 2;
      width: min(90vw, 360px);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .epic-btn {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      padding: 16px 18px;
      border: 1px solid var(--gold-primary);
      border-radius: 14px;
      background: linear-gradient(135deg, rgba(243, 156, 18, 0.18) 0%, rgba(0, 0, 0, 0.38) 100%);
      color: #edf3ff;
      font-size: 1.02rem;
      font-weight: 800;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow:
        0 10px 22px rgba(0, 0, 0, 0.45),
        inset 0 0 12px rgba(243, 156, 18, 0.08);
      transition: transform 0.18s ease, box-shadow 0.25s ease, border-color 0.25s ease;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .epic-btn:hover {
      transform: translateY(-1px);
      box-shadow:
        0 14px 26px rgba(0, 0, 0, 0.5),
        0 0 18px rgba(243, 156, 18, 0.25);
    }

    .epic-btn:active {
      transform: scale(0.98);
    }

    .epic-btn-online {
      border-color: #f1c40f;
      background: linear-gradient(135deg, rgba(241, 196, 15, 0.38) 0%, rgba(211, 84, 0, 0.32) 100%);
      box-shadow: 0 0 22px rgba(243, 156, 18, 0.35);
      animation: pulseOnline 1.8s infinite alternate;
    }

    @keyframes pulseOnline {
      0% { box-shadow: 0 0 10px rgba(243, 156, 18, 0.32); }
      100% { box-shadow: 0 0 24px rgba(241, 196, 15, 0.7); }
    }

    #game-ui {
      position: absolute;
      inset: 14px 14px auto 14px;
      z-index: 11;
      display: flex;
      align-items: center;
      justify-content: space-between;
      pointer-events: none;
    }

    #turn-indicator {
      pointer-events: auto;
      background: rgba(16, 20, 27, 0.78);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 10px 16px;
      font-weight: 700;
      font-size: 0.9rem;
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 20px rgba(0,0,0,0.25);
      letter-spacing: 0.8px;
    }

    #menu-toggle-btn,
    #camera-toggle-btn {
      pointer-events: auto;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 1px solid var(--gold-primary);
      background: rgba(14, 18, 25, 0.8);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1.1rem;
      box-shadow: 0 8px 18px rgba(0,0,0,0.3);
      transition: transform 0.15s ease;
    }

    #camera-toggle-btn {
      margin-left: 8px;
    }

    #menu-toggle-btn:active,
    #camera-toggle-btn:active {
      transform: scale(0.94);
    }

    #game-ui-right {
      display: flex;
      align-items: center;
    }

    #online-room-panel {
      position: absolute;
      right: 18px;
      top: 72px;
      z-index: 12;
      width: min(84vw, 330px);
      padding: 14px 14px 12px;
      border-radius: 14px;
      border: 1px solid rgba(243, 156, 18, 0.6);
      background: rgba(16, 19, 25, 0.84);
      box-shadow: 0 12px 26px rgba(0,0,0,0.28);
      backdrop-filter: blur(12px);
      display: none;
    }

    #online-room-panel.visible {
      display: block;
    }

    #online-room-panel .panel-title {
      font-size: 0.76rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: rgba(255, 214, 113, 0.9);
      margin-bottom: 10px;
    }

    .room-code-line {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      gap: 12px;
    }

    #room-code {
      flex: 1;
      font-size: 1.3rem;
      font-weight: 900;
      color: #fff;
      letter-spacing: 2px;
      text-align: center;
      text-shadow: 0 0 12px rgba(243, 156, 18, 0.5);
    }

    #room-status {
      font-size: 0.8rem;
      color: #cfd8e5;
      min-height: 18px;
    }

    .code-input-wrap {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    .code-input-wrap input {
      flex: 1;
      border: 1px solid rgba(243,156,18,0.5);
      background: rgba(255,255,255,0.05);
      color: white;
      padding: 9px 10px;
      border-radius: 8px;
      outline: none;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      font-weight: 700;
    }

    .code-input-wrap button {
      border: 1px solid rgba(243,156,18,0.6);
      background: linear-gradient(135deg, rgba(243,156,18,0.2), rgba(255,255,255,0.02));
      color: #fff;
      padding: 8px 10px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 700;
    }

    .promotion-modal {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 200;
      width: min(86vw, 360px);
      padding: 22px 18px 18px;
      background: rgba(15, 18, 25, 0.9);
      border: 2px solid rgba(243, 156, 18, 0.7);
      border-radius: 18px;
      box-shadow:
        0 0 28px rgba(0,0,0,0.65),
        0 0 18px rgba(243, 156, 18, 0.2);
      display: none;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .promotion-modal.visible {
      display: block;
    }

    .promotion-modal h3 {
      text-align: center;
      font-size: 1.2rem;
      letter-spacing: 1.8px;
      color: #f7d66d;
      text-transform: uppercase;
      margin-bottom: 16px;
    }

    .promo-options {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .promo-btn {
      background: rgba(255,255,255,0.04);
      color: #fff;
      border: 1px solid rgba(243,162,18,0.35);
      border-radius: 12px;
      padding: 14px 12px;
      font-size: 2rem;
      cursor: pointer;
      transition: transform 0.15s ease, background 0.2s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      min-height: 80px;
    }

    .promo-btn span {
      font-size: 0.82rem;
      color: #dfe8f3;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .promo-btn:hover {
      background: rgba(243, 156, 18, 0.2);
      transform: translateY(-1px);
    }

    .toast {
      position: absolute;
      left: 50%;
      bottom: 26px;
      transform: translateX(-50%);
      z-index: 220;
      background: rgba(17, 20, 27, 0.9);
      border: 1px solid rgba(243, 156, 18, 0.4);
      color: white;
      padding: 10px 16px;
      border-radius: 999px;
      font-size: 0.8rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease, transform 0.25s ease;
      box-shadow: 0 10px 24px rgba(0,0,0,0.25);
      white-space: nowrap;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(-2px);
    }

    @media (max-width: 560px) {
      #turn-indicator {
        font-size: 0.75rem;
        padding: 9px 12px;
      }

      #camera-toggle-btn,
      #menu-toggle-btn {
        width: 38px;
        height: 38px;
      }

      .epic-title {
        letter-spacing: 2px;
      }

      .menu-buttons {
        gap: 12px;
      }

      .epic-btn {
        font-size: 0.9rem;
        letter-spacing: 0.5px;
      }
    }
  </style>
</head>
<body>
  <div id="canvas-container"></div>

  <div id="start-menu">
    <div class="epic-title-box">
      <h1 class="epic-title"><i class="fa-solid fa-chess"></i> CHESS 3D</h1>
      <div class="epic-subtitle">Edición Leyenda</div>
    </div>

    <div class="menu-buttons">
      <button class="epic-btn epic-btn-online" id="btn-online">
        <i class="fa-solid fa-globe"></i> Buscar sala (online)
      </button>
      <button class="epic-btn" id="btn-ai-easy">
        <i class="fa-solid fa-robot"></i> VS IA (Fácil)
      </button>
      <button class="epic-btn" id="btn-ai-normal">
        <i class="fa-solid fa-brain"></i> VS IA (Normal)
      </button>
      <button class="epic-btn" id="btn-local">
        <i class="fa-solid fa-users"></i> 2 Jugadores (Local)
      </button>
    </div>
  </div>

  <div id="game-ui">
    <div class="hud-card" id="turn-indicator">Turno: Blancas</div>
    <div id="game-ui-right">
      <button id="camera-toggle-btn" title="Vista 3D / Superior"><i class="fa-solid fa-cube"></i></button>
      <button id="menu-toggle-btn" title="Menú"><i class="fa-solid fa-bars"></i></button>
    </div>
  </div>

  <div id="online-room-panel">
    <div class="panel-title">Sala Online</div>
    <div class="room-code-line">
      <div id="room-code">--</div>
    </div>
    <div id="room-status">Esperando rival...</div>
    <div class="code-input-wrap">
      <input id="join-code-input" type="text" maxlength="6" placeholder="CÓDIGO" />
      <button id="join-room-btn">Unirse</button>
    </div>
  </div>

  <div class="promotion-modal" id="promotion-modal">
    <h3>Promoción de Peón</h3>
    <div class="promo-options">
      <button class="promo-btn" data-piece="q"><span>♛</span><span>Reina</span></button>
      <button class="promo-btn" data-piece="r"><span>♜</span><span>Torre</span></button>
      <button class="promo-btn" data-piece="b"><span>♝</span><span>Alfil</span></button>
      <button class="promo-btn" data-piece="n"><span>♞</span><span>Caballo</span></button>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script>
    const pieceValues = { p: 100, n: 320, b: 330, r: 500, q: 900, k: 20000 };

    let scene, camera, renderer, controls;
    let boardGroup, piecesGroup, boardTiles = {};
    let selectedSquare = null;
    let validMoves = [];
    let lastMove = null;
    let game = new Chess();
    let currentMode = "local";
    let aiColor = "b";
    let isAIThinking = false;
    let topViewEnabled = false;
    let pendingPromotion = null;
    let onlineState = null;
    let moveMarkers = [];
    let selectedRing = null;

    const mouse = new THREE.Vector2();
    const raycaster = new THREE.Raycaster();

    function init3D() {
      const container = document.getElementById("canvas-container");
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x090b10);

      camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 8.5, 8.5);

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      container.appendChild(renderer.domElement);

      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.enablePan = true;
      controls.minDistance = 5;
      controls.maxDistance = 18;
      controls.target.set(0, 0, 0);
      controls.maxPolarAngle = Math.PI / 2.15;

      const ambient = new THREE.AmbientLight(0xffffff, 0.8);
      scene.add(ambient);

      const dirLight = new THREE.DirectionalLight(0xfff1cc, 1.0);
      dirLight.position.set(6, 12, 8);
      dirLight.castShadow = true;
      dirLight.shadow.mapSize.set(1024, 1024);
      scene.add(dirLight);

      const rim = new THREE.DirectionalLight(0x91c4ff, 0.5);
      rim.position.set(-8, 6, -6);
      scene.add(rim);

      boardGroup = new THREE.Group();
      piecesGroup = new THREE.Group();
      scene.add(boardGroup);
      scene.add(piecesGroup);

      createBoard();
      resetBoardVisualState();

      renderer.domElement.addEventListener("pointerdown", onPointerDown);
      window.addEventListener("resize", onWindowResize);
      animate();
    }

    function createBoard() {
      const base = new THREE.Mesh(
        new THREE.BoxGeometry(9.8, 0.9, 9.8),
        new THREE.MeshStandardMaterial({
          color: 0x291d13,
          roughness: 0.82,
          metalness: 0.1
        })
      );
      base.position.y = -0.55;
      base.receiveShadow = true;
      boardGroup.add(base);

      const inner = new THREE.Mesh(
        new THREE.BoxGeometry(8.4, 0.3, 8.4),
        new THREE.MeshStandardMaterial({
          color: 0x4d2e1c,
          roughness: 0.9,
          metalness: 0.15
        })
      );
      inner.position.y = 0.0;
      inner.receiveShadow = true;
      boardGroup.add(inner);

      for (let rank = 0; rank < 8; rank++) {
        for (let file = 0; file < 8; file++) {
          const square = String.fromCharCode(97 + file) + (8 - rank);
          const isLight = (rank + file) % 2 === 0;
          const tile = new THREE.Mesh(
            new THREE.BoxGeometry(1, 0.2, 1),
            new THREE.MeshStandardMaterial({
              color: isLight ? 0xe5d4a2 : 0x3b2618,
              roughness: 0.8,
              metalness: 0.12,
              emissive: 0x000000,
              emissiveIntensity: 0.0
            })
          );
          tile.position.set(file - 3.5, 0.14, rank - 3.5);
          tile.castShadow = true;
          tile.receiveShadow = true;
          tile.userData.square = square;
          boardGroup.add(tile);
          boardTiles[square] = tile;
        }
      }
    }

    function resetBoardVisualState() {
      const squares = Object.keys(boardTiles);
      for (const square of squares) {
        const tile = boardTiles[square];
        const file = square.charCodeAt(0) - 97;
        const rank = Number(square[1]) - 1;
        const isLight = (file + rank) % 2 === 0;
        tile.material.color.setHex(isLight ? 0xe5d4a2 : 0x3b2618);
        tile.material.emissive.setHex(0x000000);
        tile.material.emissiveIntensity = 0.0;
      }
      if (selectedRing) {
        selectedRing.visible = false;
      }
      for (const ring of moveMarkers) boardGroup.remove(ring);
      moveMarkers = [];
    }

    function squareToWorld(square) {
      const file = square.charCodeAt(0) - 97;
      const rank = Number(square[1]);
      return {
        x: file - 3.5,
        z: 8 - rank - 3.5
      };
    }

    function renderPieces() {
      piecesGroup.clear();
      const board = game.board();
      for (let rank = 0; rank < 8; rank++) {
        for (let file = 0; file < 8; file++) {
          const piece = board[rank][file];
          if (!piece) continue;
          const square = String.fromCharCode(97 + file) + (8 - rank);
          const mesh = createPieceMesh(piece);
          const pos = squareToWorld(square);
          mesh.position.set(pos.x, 0.45, pos.z);
          mesh.userData.square = square;
          mesh.userData.type = piece.type;
          mesh.userData.color = piece.color;
          piecesGroup.add(mesh);
        }
      }
    }

    function createPieceMesh(piece) {
      const group = new THREE.Group();

      const bodyMaterial = new THREE.MeshStandardMaterial({
        color: piece.color === "w" ? 0xf6f0e9 : 0x121821,
        metalness: 0.8,
        roughness: 0.28,
        emissive: piece.color === "w" ? 0x1d1d1d : 0x000000,
        emissiveIntensity: piece.color === "w" ? 0.15 : 0.0
      });

      const accentMaterial = new THREE.MeshStandardMaterial({
        color: piece.color === "w" ? 0xe5d6a6 : 0x3b4c5d,
        metalness: 0.72,
        roughness: 0.4
      });

      const base = new THREE.Mesh(new THREE.CylinderGeometry(0.38, 0.42, 0.18, 32), accentMaterial);
      base.position.y = 0.08;
      base.castShadow = true;
      group.add(base);

      const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.2, 0.42, 18), bodyMaterial);
      stem.position.y = 0.31;
      stem.castShadow = true;
      group.add(stem);

      switch (piece.type) {
        case "p": {
          const body = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.18, 0.42, 18), bodyMaterial);
          body.position.y = 0.54;
          body.castShadow = true;
          group.add(body);

          const head = new THREE.Mesh(new THREE.SphereGeometry(0.16, 20, 20), bodyMaterial);
          head.position.y = 0.85;
          head.castShadow = true;
          group.add(head);

          const crown = new THREE.Mesh(new THREE.ConeGeometry(0.14, 0.2, 18), accentMaterial);
          crown.position.y = 1.02;
          crown.castShadow = true;
          group.add(crown);
          break;
        }
        case "r": {
          const top = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.22, 0.24, 18), accentMaterial);
          top.position.y = 0.78;
          top.castShadow = true;
          group.add(top);

          const body = new THREE.Mesh(new THREE.BoxGeometry(0.48, 0.38, 0.48), bodyMaterial);
          body.position.y = 0.54;
          body.castShadow = true;
          group.add(body);

          const battlements = [];
          for (let i = -1; i <= 1; i += 2) {
            const b = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.14, 0.08), accentMaterial);
            b.position.set(i * 0.16, 0.92, 0.16);
            b.castShadow = true;
            group.add(b);
            battlements.push(b);
          }
          break;
        }
        case "n": {
          const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.14, 0.18, 0.42, 18), bodyMaterial);
          neck.position.y = 0.48;
          neck.castShadow = true;
          group.add(neck);

          const head = new THREE.Mesh(new THREE.SphereGeometry(0.18, 18, 18), bodyMaterial);
          head.position.set(0.09, 0.9, 0.0);
          head.scale.set(1.1, 0.9, 1.0);
          head.castShadow = true;
          group.add(head);

          const snout = new THREE.Mesh(new THREE.ConeGeometry(0.1, 0.24, 18), accentMaterial);
          snout.position.set(0.24, 0.82, 0);
          snout.rotation.z = -Math.PI / 2.8;
          snout.castShadow = true;
          group.add(snout);

          const ear = new THREE.Mesh(new THREE.ConeGeometry(0.06, 0.12, 12), accentMaterial);
          ear.position.set(-0.08, 1.18, 0.02);
          ear.rotation.z = Math.PI / 10;
          ear.castShadow = true;
          group.add(ear);
          break;
        }
        case "b": {
          const body = new THREE.Mesh(new THREE.CylinderGeometry(0.14, 0.18, 0.42, 18), bodyMaterial);
          body.position.y = 0.52;
          body.castShadow = true;
          group.add(body);

          const head = new THREE.Mesh(new THREE.SphereGeometry(0.17, 20, 20), bodyMaterial);
          head.position.y = 0.92;
          head.castShadow = true;
          group.add(head);

          const mitre = new THREE.Mesh(new THREE.ConeGeometry(0.12, 0.22, 18), accentMaterial);
          mitre.position.y = 1.12;
          mitre.castShadow = true;
          group.add(mitre);
          break;
        }
        case "q": {
          const crownRing = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.2, 0.18, 18), accentMaterial);
          crownRing.position.y = 0.8;
          crownRing.castShadow = true;
          group.add(crownRing);

          const body = new THREE.Mesh(new THREE.CylinderGeometry(0.17, 0.2, 0.42, 18), bodyMaterial);
          body.position.y = 0.56;
          body.castShadow = true;
          group.add(body);

          for (let i = 0; i < 5; i++) {
            const spike = new THREE.Mesh(new THREE.ConeGeometry(0.08, 0.18, 12), accentMaterial);
            const ang = (i / 5) * Math.PI * 2;
            spike.position.set(Math.cos(ang) * 0.15, 1.08, Math.sin(ang) * 0.15);
            spike.castShadow = true;
            group.add(spike);
          }
          break;
        }
        case "k": {
          const crown = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.2, 0.22, 18), accentMaterial);
          crown.position.y = 0.84;
          crown.castShadow = true;
          group.add(crown);

          const body = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.2, 0.46, 18), bodyMaterial);
          body.position.y = 0.58;
          body.castShadow = true;
          group.add(body);

          const crossBar = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.22, 0.08), accentMaterial);
          crossBar.position.set(0, 1.18, 0);
          crossBar.castShadow = true;
          group.add(crossBar);

          const crossStem = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.08, 0.08), accentMaterial);
          crossStem.position.set(0, 1.18, 0);
          crossStem.castShadow = true;
          group.add(crossStem);
          break;
        }
      }

      group.scale.setScalar(0.9);
      group.rotation.y = piece.color === "w" ? 0.06 : Math.PI;
      return group;
    }

    function updateSelectionHighlights() {
      const squares = Object.keys(boardTiles);
      for (const square of squares) {
        const tile = boardTiles[square];
        const file = square.charCodeAt(0) - 97;
        const rank = Number(square[1]) - 1;
        const isLight = (file + rank) % 2 === 0;
        const baseHex = isLight ? 0xe5d4a2 : 0x3b2618;

        tile.material.color.setHex(baseHex);
        tile.material.emissive.setHex(0x000000);
        tile.material.emissiveIntensity = 0.0;

        if (lastMove && (square === lastMove.from || square === lastMove.to)) {
          tile.material.emissive.setHex(0x8a6d1f);
          tile.material.emissiveIntensity = 0.9;
        }

        if (selectedSquare === square) {
          tile.material.emissive.setHex(0xf39c12);
          tile.material.emissiveIntensity = 0.85;
          selectedRing.position.set(...Object.values(squareToWorld(square)), 0.28);
          selectedRing.visible = true;
        }
      }

      for (const ring of moveMarkers) {
        boardGroup.remove(ring);
      }
      moveMarkers = [];

      validMoves.forEach(move => {
        const { x, z } = squareToWorld(move.to);
        const ring = new THREE.Mesh(
          new THREE.TorusGeometry(0.34, 0.045, 12, 28),
          new THREE.MeshStandardMaterial({
            color: 0x38d98e,
            emissive: 0x1f9a56,
            emissiveIntensity: 0.8,
            metalness: 0.1,
            roughness: 0.55
          })
        );
        ring.rotation.x = -Math.PI / 2;
        ring.position.set(x, 0.22, z);
        boardGroup.add(ring);
        moveMarkers.push(ring);
      });
    }

    function initializeSelectionRing() {
      selectedRing = new THREE.Mesh(
        new THREE.TorusGeometry(0.38, 0.045, 12, 40),
        new THREE.MeshStandardMaterial({
          color: 0xf6d85d,
          emissive: 0xf39c12,
          emissiveIntensity: 1.0,
          metalness: 0.3,
          roughness: 0.5
        })
      );
      selectedRing.rotation.x = -Math.PI / 2;
      selectedRing.position.set(0, 0.28, 0);
      selectedRing.visible = false;
      boardGroup.add(selectedRing);
    }

    function showToast(msg) {
      const toast = document.getElementById("toast");
      toast.textContent = msg;
      toast.classList.add("show");
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => toast.classList.remove("show"), 1600);
    }

    function updateTurnIndicator() {
      const indicator = document.getElementById("turn-indicator");
      const turnText = game.turn() === "w" ? "Turno: Blancas" : "Turno: Negras";
      indicator.textContent = turnText;
    }

    function getLegalMovesForSquare(square) {
      return game.moves({ square, verbose: true });
    }

    function isHumanTurn() {
      if (currentMode === "local") return true;
      if (currentMode === "aiEasy" || currentMode === "aiNormal") return game.turn() === "w";
      if (currentMode === "online") {
        if (!onlineState || !onlineState.myColor) return false;
        return game.turn() === onlineState.myColor;
      }
      return false;
    }

    function setSelected(square) {
      selectedSquare = square;
      validMoves = getLegalMovesForSquare(square);
      updateSelectionHighlights();
    }

    function clearSelection() {
      selectedSquare = null;
      validMoves = [];
      updateSelectionHighlights();
    }

    function getMoveFromTo(from, to) {
      const moves = game.moves({ square: from, verbose: true });
      return moves.find(move => move.to === to);
    }

    function audioReady() {
      AudioEngine.init();
      if (AudioEngine.ctx && AudioEngine.ctx.state === "suspended") {
        AudioEngine.ctx.resume();
      }
    }

    const AudioEngine = {
      ctx: null,
      init() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioCtx();
        }
        return this.ctx;
      },
      playSelect() {
        this.init();
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = "square";
        osc.frequency.setValueAtTime(520, now);
        osc.frequency.exponentialRampToValueAtTime(240, now + 0.08);
        gain.gain.setValueAtTime(0.06, now);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.08);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.08);
      },
      playMove() {
        this.init();
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(280, now);
        osc.frequency.exponentialRampToValueAtTime(120, now + 0.09);
        gain.gain.setValueAtTime(0.08, now);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.09);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.09);
      },
      playCapture() {
        this.init();
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = "triangle";
        osc.frequency.setValueAtTime(220, now);
        osc.frequency.exponentialRampToValueAtTime(52, now + 0.22);
        gain.gain.setValueAtTime(0.14, now);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.22);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.22);
      },
      playCheck() {
        this.init();
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = "sawtooth";
        osc.frequency.setValueAtTime(200, now);
        osc.frequency.exponentialRampToValueAtTime(68, now + 0.18);
        gain.gain.setValueAtTime(0.16, now);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.18);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.18);
      }
    };

    function startMatch(mode) {
      currentMode = mode;
      game = new Chess();
      selectedSquare = null;
      validMoves = [];
      lastMove = null;
      pendingPromotion = null;
      isAIThinking = false;
      hidePromotionModal();
      hideStartMenu();
      renderPieces();
      updateTurnIndicator();
      resetBoardVisualState();
      if (mode === "online") {
        setupOnlineState();
      } else {
        hideOnlinePanel();
      }
      if (mode === "aiEasy" || mode === "aiNormal") {
        aiColor = "b";
      }
      audioReady();
    }

    function hideStartMenu() {
      const menu = document.getElementById("start-menu");
      menu.style.opacity = "0";
      setTimeout(() => {
        menu.style.display = "none";
      }, 450);
    }

    function showStartMenu() {
      const menu = document.getElementById("start-menu");
      menu.style.display = "flex";
      menu.style.opacity = "1";
    }

    function setupOnlineState() {
      const roomCode = Math.random().toString(36).slice(2, 7).toUpperCase();
      onlineState = {
        roomCode,
        myColor: Math.random() < 0.5 ? "w" : "b",
        opponentConnected: false
      };

      const codeEl = document.getElementById("room-code");
      const statusEl = document.getElementById("room-status");
      codeEl.textContent = roomCode;
      statusEl.textContent = "Buscando rival...";
      showOnlinePanel();

      setTimeout(() => {
        onlineState.opponentConnected = true;
        statusEl.textContent = onlineState.myColor === "w"
          ? "Rival conectado. Empiezas tú."
          : "Rival conectado. Esperando la jugada...";
      }, 1000);

      if (onlineState.myColor === "b") {
        setTimeout(() => {
          if (!game.isGameOver() && game.turn() === "b") {
            const move = chooseAIMove(1, "b");
            if (move) {
              applyMove(move.from, move.to, move.promotion || "q");
            }
          }
        }, 1500);
      }
    }

    function showOnlinePanel() {
      const panel = document.getElementById("online-room-panel");
      panel.classList.add("visible");
    }

    function hideOnlinePanel() {
      const panel = document.getElementById("online-room-panel");
      panel.classList.remove("visible");
      onlineState = null;
    }

    function handleMoveResult(move) {
      lastMove = { from: move.from, to: move.to };
      const wasCapture = !!move.captured;
      const status = game.isCheckmate()
        ? "Jaque mate"
        : game.isStalemate()
          ? "Tablas por ahogado"
          : game.isThreefoldRepetition()
            ? "Tablas por repetición"
            : game.isInsufficientMaterial()
              ? "Tablas por material insuficiente"
              : null;

      if (wasCapture) {
        AudioEngine.playCapture();
      } else {
        AudioEngine.playMove();
      }

      if (game.inCheck()) {
        AudioEngine.playCheck();
      }

      if (status) {
        showToast(status);
      }

      updateSelectionHighlights();
      renderPieces();
      updateTurnIndicator();

      if (game.isGameOver()) {
        showToast(game.isCheckmate() ? "Jaque mate" : "Partida terminada");
        return;
      }

      if ((currentMode === "aiEasy" || currentMode === "aiNormal") && game.turn() === "b") {
        triggerAI();
      }
    }

    function finaliseMove(from, to, promotion = "q") {
      const move = game.move({ from, to, promotion });
      if (!move) {
        return false;
      }
      handleMoveResult(move);
      return true;
    }

    function attemptMove(from, to) {
      const move = getMoveFromTo(from, to);
      if (!move) return false;

      if (move.flags.includes("p") || move.promotion) {
        pendingPromotion = { from, to };
        showPromotionModal();
        return true;
      }

      return finaliseMove(from, to, "q");
    }

    function showPromotionModal() {
      const modal = document.getElementById("promotion-modal");
      modal.classList.add("visible");
    }

    function hidePromotionModal() {
      const modal = document.getElementById("promotion-modal");
      modal.classList.remove("visible");
    }

    document.querySelectorAll(".promo-btn").forEach(button => {
      button.addEventListener("click", () => {
        const choice = button.dataset.piece;
        if (!pendingPromotion) return;
        finaliseMove(pendingPromotion.from, pendingPromotion.to, choice);
        pendingPromotion = null;
        hidePromotionModal();
      });
    });

    function triggerAI() {
      if (isAIThinking || game.turn() !== "b") return;
      isAIThinking = true;
      const delay = currentMode === "aiEasy" ? 350 : 700;
      setTimeout(() => {
        const move = chooseAIMove(currentMode === "aiEasy" ? 1 : 2, "b");
        if (move) {
          finaliseMove(move.from, move.to, move.promotion || "q");
        }
        isAIThinking = false;
      }, delay);
    }

    function chooseAIMove(depth, aiSide) {
      const moves = game.moves({ verbose: true });
      if (!moves.length) return null;

      if (currentMode === "aiEasy") {
        return moves[Math.floor(Math.random() * moves.length)];
      }

      let bestScore = -Infinity;
      let bestMove = moves[0];

      for (const move of moves) {
        const moveOptions = {
          from: move.from,
          to: move.to,
          promotion: move.promotion || "q"
        };

        game.move(moveOptions);
        const score = minimax(depth - 1, -Infinity, Infinity, aiSide);
        game.undo();

        if (score > bestScore) {
          bestScore = score;
          bestMove = move;
        }
      }

      return bestMove;
    }

    function minimax(depth, alpha, beta, aiSide) {
      if (depth === 0 || game.isGameOver()) {
        return evaluateBoard(aiSide);
      }

      const moves = game.moves({ verbose: true });
      if (game.turn() === aiSide) {
        let maxEval = -Infinity;
        for (const move of moves) {
          game.move({
            from: move.from,
            to: move.to,
            promotion: move.promotion || "q"
          });
          const score = minimax(depth - 1, alpha, beta, aiSide);
          game.undo();

          maxEval = Math.max(maxEval, score);
          alpha = Math.max(alpha, score);
          if (beta <= alpha) break;
        }
        return maxEval;
      } else {
        let minEval = Infinity;
        for (const move of moves) {
          game.move({
            from: move.from,
            to: move.to,
            promotion: move.promotion || "q"
          });
          const score = minimax(depth - 1, alpha, beta, aiSide);
          game.undo();

          minEval = Math.min(minEval, score);
          beta = Math.min(beta, score);
          if (beta <= alpha) break;
        }
        return minEval;
      }
    }

    function evaluateBoard(aiSide) {
      let score = 0;
      const board = game.board();

      for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
          const piece = board[r][c];
          if (!piece) continue;
          const base = pieceValues[piece.type];
          const centerBias = 1 + ((c === 3 || c === 4) ? 0.08 : 0) + ((r === 3 || r === 4) ? 0.08 : 0);
          const value = base * centerBias;

          if (piece.color === aiSide) {
            score += value;
          } else {
            score -= value;
          }
        }
      }

      return score;
    }

    function onPointerDown(event) {
      if (pendingPromotion) return;
      if (!isHumanTurn()) return;
      const rect = renderer.domElement.getBoundingClientRect();
      mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
      mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const hitTargets = [];
      piecesGroup.traverse(obj => {
        if (obj.isMesh) hitTargets.push(obj);
      });
      Object.values(boardTiles).forEach(tile => hitTargets.push(tile));

      const intersects = raycaster.intersectObjects(hitTargets, true);
      if (!intersects.length) {
        clearSelection();
        return;
      }

      let hitObj = intersects[0].object;
      while (hitObj && !hitObj.userData.square) {
        hitObj = hitObj.parent;
      }
      if (!hitObj || !hitObj.userData.square) return;

      const square = hitObj.userData.square;
      const piece = game.get(square);

      if (selectedSquare) {
        const targetMove = getMoveFromTo(selectedSquare, square);

        if (targetMove) {
          if (targetMove.flags.includes("p") || targetMove.promotion) {
            pendingPromotion = { from: selectedSquare, to: square };
            showPromotionModal();
          } else {
            finaliseMove(selectedSquare, square, "q");
          }
          clearSelection();
          return;
        }

        if (piece && piece.color === game.turn()) {
          setSelected(square);
          AudioEngine.playSelect();
          return;
        }

        clearSelection();
        return;
      }

      if (piece && piece.color === game.turn()) {
        setSelected(square);
        AudioEngine.playSelect();
      }
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }

    function toggleCameraView() {
      topViewEnabled = !topViewEnabled;
      if (topViewEnabled) {
        camera.position.set(0, 13.5, 0.1);
        controls.target.set(0, 0, 0);
        controls.minDistance = 8;
        controls.maxDistance = 18;
        controls.maxPolarAngle = Math.PI / 2.02;
        controls.enableRotate = false;
      } else {
        camera.position.set(0, 8.5, 8.5);
        controls.target.set(0, 0, 0);
        controls.minDistance = 5;
        controls.maxDistance = 18;
        controls.maxPolarAngle = Math.PI / 2.15;
        controls.enableRotate = true;
      }
      controls.update();
    }

    function bindEvents() {
      document.getElementById("btn-online").addEventListener("click", () => {
        startMatch("online");
        setTimeout(() => {
          const panel = document.getElementById("online-room-panel");
          panel.classList.add("visible");
        }, 60);
      });

      document.getElementById("btn-ai-easy").addEventListener("click", () => startMatch("aiEasy"));
      document.getElementById("btn-ai-normal").addEventListener("click", () => startMatch("aiNormal"));
      document.getElementById("btn-local").addEventListener("click", () => startMatch("local"));

      document.getElementById("menu-toggle-btn").addEventListener("click", () => {
        showStartMenu();
      });

      document.getElementById("camera-toggle-btn").addEventListener("click", () => {
        audioReady();
        toggleCameraView();
      });

      document.getElementById("join-room-btn").addEventListener("click", () => {
        const input = document.getElementById("join-code-input");
        const code = input.value.trim().toUpperCase();
        if (!code) return;
        currentMode = "online";
        onlineState = {
          roomCode: code,
          myColor: "w",
          opponentConnected: true
        };
        document.getElementById("room-code").textContent = code;
        document.getElementById("room-status").textContent = "Sala unida. Es tu turno.";
        showOnlinePanel();
        input.value = "";
      });

      document.getElementById("join-code-input").addEventListener("input", (e) => {
        e.target.value = e.target.value.replace(/[^a-zA-Z0-9]/g, "").slice(0, 6).toUpperCase();
      });
    }

    window.onload = () => {
      init3D();
      initializeSelectionRing();
      bindEvents();
      renderPieces();
      updateTurnIndicator();
      resetBoardVisualState();
      showStartMenu();
    };
  </script>
</body>
</html>
